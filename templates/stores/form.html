{% extends "base.html" %}
{% block title %}{{ 'Edit Store' if store else 'New Store' }}{% endblock %}
{% block content %}
{% set d = form_data or store %}
<h1 class="h3 mb-3">{{ 'Edit Store' if store else 'New Store' }}</h1>
<div class="card" style="max-width: 480px;">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ d.name if d else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Route</label>
        <select name="route_id" class="form-select">
          <option value="">Unassigned</option>
          {% for r in routes %}
          <option value="{{ r.id }}" {% if d and d.route_id|string == r.id|string %}selected{% endif %}>{{ r.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Area / Address</label>
        <input type="text" name="area" class="form-control" value="{{ d.area if d and d.area else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Contact</label>
        <input type="text" name="contact" class="form-control" value="{{ d.contact if d and d.contact else '' }}">
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" name="active" class="form-check-input" id="activeCheck"
          {% if (d.active if d else true) %}checked{% endif %}>
        <label class="form-check-label" for="activeCheck">Active</label>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('stores.list_stores') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
